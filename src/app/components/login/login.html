<main class="login-page">
  <section class="login-card" aria-label="FPL manager login">
    <div class="login-brand-row">
      <div class="login-brand">
        <span class="brand-mark">FPL</span>
        <span class="brand-name">Central</span>
      </div>
    </div>

    <div class="login-header">
      <p class="eyebrow">Manager access</p>
      <h1>Connect your <span>FPL</span> manager</h1>
      <p class="lead">Use your manager ID to unlock your leagues, current standings, and squad view.</p>
    </div>

    <form class="login-form" (ngSubmit)="connectManager()" #managerForm="ngForm">
      <label for="manager-id">Manager ID</label>
      <div class="input-shell">
        <input
          id="manager-id"
          name="managerId"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="3296740"
          [(ngModel)]="managerId"
          required
        />
        <button type="submit" [disabled]="managerForm.invalid || loading()">
          {{ loading() ? 'Loading...' : 'Continue' }}
        </button>
      </div>

      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
    </form>

    <div class="help-note">
      <span class="help-icon">?</span>
      <p>Find it in your FPL profile URL: <strong>fantasy.premierleague.com/entry/<em>your-id</em>/</strong></p>
    </div>

    <div class="login-footer">
      <span class="data-dot"></span>
      <span>Public FPL data only</span>
      <span class="footer-rule"></span>
      <span>No password required</span>
    </div>
  </section>
</main>
